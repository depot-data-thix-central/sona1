<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <title>THIX MARIAGE</title>
  <style> html,body{margin:0;padding:0;height:100%;background:#FFF8F9} </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Fix écran noir après inactivité - CanvasKit perd le contexte WebGL
    window.addEventListener('load', () => {
      const canvas = document.querySelector('canvas');
      if (canvas) {
        canvas.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          console.log('WebGL lost - reload');
          window.location.reload();
        });
      }
    });
    // Quand on revient sur l'onglet après 5min, on force Flutter à repaint
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        setTimeout(() => window.dispatchEvent(new Event('resize')), 300);
      }
    });
  </script>
</body>
</html>
