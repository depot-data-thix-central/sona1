<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <!-- Vos autres balises meta, title, etc. -->
</head>
<body>
  <!-- L'initialisation normale de Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Gestion fiable de la perte de contexte WebGL -->
  <script>
    (function () {
      let contextLost = false;

      function attachRecovery(canvas) {
        if (!canvas || canvas.__thixRecoveryAttached) return;
        canvas.__thixRecoveryAttached = true;

        canvas.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          contextLost = true;
          console.warn('WebGL context lost');
        });

        canvas.addEventListener('webglcontextrestored', () => {
          console.log('WebGL context restored');
          contextLost = false;
        });
      }

      function findCanvasAndAttach() {
        const canvas = document.querySelector('flt-glass-pane canvas') || document.querySelector('canvas');
        if (canvas) {
          attachRecovery(canvas);
        } else {
          setTimeout(findCanvasAndAttach, 500);
        }
      }

      window.addEventListener('load', findCanvasAndAttach);

      // Au retour de l'app / de l'onglet : ne recharger QUE si le contexte
      // a réellement été perdu (flag mis par webglcontextlost), jamais sur
      // un test getContext() qui renvoie toujours null pour un contexte
      // déjà de type webgl2/bitmaprenderer.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (contextLost) {
            console.warn('Reprise après perte de contexte WebGL confirmée → reload');
            window.location.reload();
          }
        }
      });
    })();
  </script>
</body>
</html>
